services:
  web:
    image: al-gym-sys-web:latest
    build:
      context: ./all-gym-vf
      dockerfile: Dockerfile
    env_file:
      - ./deploy/env/web.env
    environment:
      ALGYM_BACKEND_URL: http://backend:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      sync:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - gym-local

  backend:
    image: al-gym-sys-backend:latest
    build:
      context: ../algym-local-backend
      dockerfile: Dockerfile
    env_file:
      - ../algym-local-backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: host.docker.internal
      LOCAL_MEDIA_ROOT: /app/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../algym-local-backend/data/media:/app/data/media
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then((response)=>response.json()).then((body)=>process.exit(body.status==='ready'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - gym-local

  postgres:
    profiles:
      - container-db
    image: postgres:17-alpine
    env_file:
      - path: ./deploy/env/postgres.env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-local

  backup:
    profiles:
      - container-db
    image: postgres:17-alpine
    env_file:
      - path: ./deploy/env/postgres.env
        required: false
    environment:
      ALGYM_CONTAINER_BACKUP: "1"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: algym
      DB_USER: postgres
      LOCAL_MEDIA_ROOT: /media
      BACKUP_ROOT: /backups
      BACKUP_INTERVAL_SECONDS: ${ALGYM_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_COUNT: ${ALGYM_BACKUP_KEEP_COUNT:-30}
    entrypoint: ["/bin/sh", "/scripts/backup_loop.sh"]
    volumes:
      - ../algym-local-backend/database/scripts/backup_local_database.sh:/scripts/backup_local_database.sh:ro
      - ../algym-local-backend/database/scripts/backup_loop.sh:/scripts/backup_loop.sh:ro
      - ../algym-local-backend/database/scripts/backup_health.sh:/scripts/backup_health.sh:ro
      - ../algym-local-backend/database/scripts/prune_automatic_backups.sh:/scripts/prune_automatic_backups.sh:ro
      - ../algym-local-backend/data/media:/media:ro
      - ${ALGYM_BACKUP_DIR:-../algym-local-backend/backups/local}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/backup_health.sh"]
      interval: 15m
      timeout: 10s
      retries: 2
      start_period: 30m
    networks:
      - gym-local

  sync:
    image: al-gym-sys-sync:latest
    build:
      context: ./gym-sync-server
      dockerfile: Dockerfile
    env_file:
      - ./deploy/env/sync.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SYNC_BIND_HOST:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - gym-local

  cloudflared:
    profiles:
      - remote-access
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://web:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-local

networks:
  gym-local:
    driver: bridge

volumes:
  postgres_data:
