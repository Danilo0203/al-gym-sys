services:
  web:
    build:
      context: ./all-gym-vf
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    env_file:
      - ./deploy/env/web.env
    environment:
      ALGYM_BACKEND_URL: http://backend:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      sync:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - gym-local

  backend:
    build:
      context: ../algym-local-backend
      dockerfile: Dockerfile
    env_file:
      - ../algym-local-backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: host.docker.internal
      LOCAL_MEDIA_ROOT: /app/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../algym-local-backend/data/media:/app/data/media
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then((response)=>response.json()).then((body)=>process.exit(body.status==='ready'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - gym-local

  postgres:
    profiles:
      - container-db
    image: postgres:17-alpine
    env_file:
      - path: ./deploy/env/postgres.env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-local

  sync:
    build:
      context: ./gym-sync-server
      dockerfile: Dockerfile
    env_file:
      - ./deploy/env/sync.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SYNC_BIND_HOST:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - gym-local

  cloudflared:
    profiles:
      - remote-access
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://web:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-local

networks:
  gym-local:
    driver: bridge

volumes:
  postgres_data:
